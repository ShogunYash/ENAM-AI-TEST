<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6FB" />
    <title>FINN · Triage Desk</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('finn.theme') || 'light';
          var isDark = saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0E1424');
          } else {
            document.documentElement.classList.remove('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#F4F6FB');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-zinc-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
