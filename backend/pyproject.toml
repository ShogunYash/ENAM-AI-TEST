[project]
name = "finn-backend"
version = "0.1.0"
description = "FINN — mobile-first financial investment agent (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "pyyaml>=6",
    "selectolax>=0.3",
    "uvicorn[standard]>=0.30",
    "yfinance>=1.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["B008", "ISC004", "SIM102"]  # B008: FastAPI Query() defaults; ISC004/SIM102: style nits in regex tables
